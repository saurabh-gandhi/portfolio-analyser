<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-elevated: #334155;
            --primary: #38bdf8;
            --secondary: #fbbf24;
            --success: #4ade80;
            --danger: #f87171;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --font: 'Plus Jakarta Sans', sans-serif;
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font);
            margin: 0;
            padding: 2.5rem;
            line-height: 1.5;
        }

        .dashboard {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 3rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .brand h1 {
            font-size: 2.25rem;
            font-weight: 800;
            margin: 0;
            letter-spacing: -0.04em;
            background: linear-gradient(to right, #fff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand p {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin: 0.5rem 0 0;
            font-weight: 500;
        }

        .account-badge {
            background: var(--surface);
            padding: 0.5rem 1rem;
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--primary);
            border: 1px solid var(--border);
            letter-spacing: 0.05em;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .stat-card {
            background: var(--surface);
            padding: 1.75rem;
            border-radius: 1.25rem;
            border: 1px solid var(--border);
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
            overflow: hidden;
        }
        
        .stat-card:hover {
            transform: translateY(-4px);
            border-color: rgba(56, 189, 248, 0.3);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--primary);
            opacity: 0.3;
        }

        .stat-card.xirr::before { background: var(--secondary); opacity: 1; }
        .stat-card.gain::before { background: var(--success); opacity: 1; }

        .stat-card .label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.75rem;
        }

        .stat-card .value {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .stat-card .sub-value {
            font-size: 0.875rem;
            font-weight: 600;
            margin-top: 0.5rem;
            display: block;
        }

        .chart-container {
            background: var(--surface);
            border-radius: 1.5rem;
            padding: 2.5rem;
            border: 1px solid var(--border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .chart-header h2 {
            font-size: 1.25rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.01em;
        }

        .legend {
            display: flex;
            gap: 1.5rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.625rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .legend-marker {
            width: 10px;
            height: 10px;
            border-radius: 3px;
        }

        /* D3 Elements */
        .bar-buy { fill: var(--primary); opacity: 0.7; }
        .bar-sell { fill: var(--danger); opacity: 0.7; }
        .line-cum { 
            fill: none; 
            stroke: var(--secondary); 
            stroke-width: 4; 
            stroke-linecap: round;
            filter: drop-shadow(0 4px 6px rgba(251, 191, 36, 0.2));
        }
        .dot-cum {
            fill: var(--bg);
            stroke: var(--secondary);
            stroke-width: 3;
        }

        .axis-label {
            font-size: 11px;
            fill: var(--text-muted);
            font-weight: 600;
        }

        .grid line {
            stroke: rgba(255, 255, 255, 0.05);
            shape-rendering: crispEdges;
        }

        .crosshair line {
            stroke: var(--text-muted);
            stroke-width: 1;
            stroke-dasharray: 4,4;
            opacity: 0.5;
        }

        .tooltip {
            position: absolute;
            padding: 1rem;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            color: white;
            border-radius: 1rem;
            font-size: 0.8125rem;
            pointer-events: none;
            opacity: 0;
            z-index: 100;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
            min-width: 200px;
        }

        .tooltip .date { 
            font-weight: 800; 
            font-size: 0.875rem;
            margin-bottom: 0.75rem; 
            color: var(--text);
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
        }
        .tooltip .row { display: flex; justify-content: space-between; margin-bottom: 0.375rem; }
        .tooltip .label { color: var(--text-muted); font-weight: 500; }
        .tooltip .val { font-weight: 700; font-variant-numeric: tabular-nums; }

        @media (max-width: 1024px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>

: "2026-04-01", "net_invest": 15.312899999997171, "cum_invest": 23087220.6309672}];
        const data = rawData.map(d => ({
            ...d,
            date: new Date(d.date),
            net_invest: +d.net_invest,
            cum_invest: +d.cum_invest
        }));

        const margin = { top: 40, right: 80, bottom: 60, left: 80 };
        const width = document.querySelector('.chart-container').clientWidth - margin.left - margin.right - 80;
        const height = 480 - margin.top - margin.bottom;

        const svg = d3.select("#chart")
            .append("svg")
            .attr("viewBox", `0 0 ${width + margin.left + margin.right} ${height + margin.top + margin.bottom}`)
            .attr("preserveAspectRatio", "xMinYMin meet")
            .append("g")
            .attr("transform", `translate(${margin.left}, ${margin.top})`);

        // Scales
        const x = d3.scaleTime()
            .domain(d3.extent(data, d => d.date))
            .range([0, width]);

        const yLeft = d3.scaleLinear()
            .domain([
                Math.min(0, d3.min(data, d => d.net_invest)) * 1.2,
                d3.max(data, d => d.net_invest) * 1.2

            .nice()
            .range([height, 0]);

            .domain([0, d3.max(data, d => d.cum_invest) * 1.1])
            .nice()
            .range([height, 0]);

        svg.append("g")
            .attr("class", "grid")

        svg.append("g")
            .attr("transform", `translate(0, ${height})`)
            .call(d3.axisBottom(x).ticks(width > 600 ? 10 : 5).tickFormat(d3.timeFormat("%b '%y")))
            .attr("class", "axis-label")
            .call(g => g.select(".domain").remove())
            .call(g => g.selectAll(".tick line").remove());

        const fmtL = d => `₹${(d/1e5).toFixed(1)}L`;

        svg.append("g")
            .call(d3.axisLeft(yLeft).ticks(6).tickFormat(fmtL))
            .attr("class", "axis-label")
            .call(g => g.select(".domain").remove());

            })
            .on("mouseout", () => {
                tooltip.style("opacity", 0);
                crosshair.style("display", "none");
            });
